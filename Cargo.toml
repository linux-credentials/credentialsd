[workspace]
resolver = "3"
members = ["credentialsd", "credentialsd-common", "credentialsd-ui"]

[profile.release]
lto = true

[workspace.dependencies]
futures-lite = "=2.6.1"
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
zbus = { version = "=5.18.0", default-features = false }
zvariant = "=5.13.1"
